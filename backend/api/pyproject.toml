[project]
name = "neuronode-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "mangum==0.17.0",
    "pg8000==1.31.2",
    "boto3==1.34.100",
    "opensearch-py==2.6.0",
    "requests-aws4auth==1.3.1",
    "pydantic==2.7.1",
    "python-dotenv==1.0.1",
]

[tool.uv]
# Local dev:  uv sync && uv run uvicorn api:app --reload
# Lambda build: see deploy.sh

[tool.pyright]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportExplicitAny = false
reportAny = false

[dependency-groups]
dev = [
    "basedpyright>=1.39.4",
    "boto3-stubs[dynamodb,lambda]>=1.43.6",
]
