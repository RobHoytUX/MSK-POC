<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSK POC - Action Board</title>
  </head>
  <body>
    <style>
      /* Visible shell if Tailwind/CSS fails or is delayed; avoids a blank white first paint */
      html,
      body,
      #root {
        min-height: 100vh;
        margin: 0;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1rem;
        background: #f8fafc;
        font-family: system-ui, sans-serif;
        color: #64748b;
        font-size: 0.875rem;
      }
      #initial-loader .spinner {
        width: 3rem;
        height: 3rem;
        border: 4px solid #e0e7ff;
        border-top-color: #4f46e5;
        border-radius: 9999px;
        animation: msk-spin 0.85s linear infinite;
      }
      @keyframes msk-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <div id="root">
      <div id="initial-loader" aria-busy="true" aria-live="polite">
        <div class="spinner"></div>
        <span>Loading...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
